# ============================================
# TTYD CONFIGURATION
# Sourced by entrypoint scripts
# Colors are defined in theme.conf
# ============================================

# --- Terminal Appearance ---
# Font is rendered client-side (browser). Install a Nerd Font locally:
# https://www.nerdfonts.com/
TTYD_FONT_FAMILY="JetBrainsMono Nerd Font, Ubuntu Mono, monospace"
TTYD_FONT_SIZE=14
TTYD_FONT_WEIGHT=500
TTYD_FONT_WEIGHT_BOLD=700
TTYD_CURSOR_STYLE=block
TTYD_CURSOR_BLINK=true

# --- Terminal Behavior ---
TTYD_SCROLLBACK=50000
