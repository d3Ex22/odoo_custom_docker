# ============================================
# TTYD CONFIGURATION
# Sourced by wrapper script
# ============================================

# --- Terminal Appearance ---
TTYD_FONT_FAMILY="JetBrains Mono, Fira Code, Consolas, monospace"
TTYD_FONT_SIZE=14
TTYD_CURSOR_STYLE=block
TTYD_CURSOR_BLINK=true

# --- Colors (custom dark theme) ---
TTYD_THEME='{"background": "#000000", "foreground": "#ffffff", "cursor": "#ffffff", "cursorAccent": "#000000", "selection": "#333333", "black": "#000000", "red": "#ff5555", "green": "#50fa7b", "yellow": "#f1fa8c", "blue": "#bd93f9", "magenta": "#ff79c6", "cyan": "#8be9fd", "white": "#f8f8f2", "brightBlack": "#666666", "brightRed": "#ff6e6e", "brightGreen": "#69ff94", "brightYellow": "#ffffa5", "brightBlue": "#d6acff", "brightMagenta": "#ff92df", "brightCyan": "#a4ffff", "brightWhite": "#ffffff"}'

# --- Terminal Behavior ---
TTYD_ENABLE_SIXEL=true
TTYD_WRITABLE=true

# --- Scrollback ---
TTYD_SCROLLBACK=50000
