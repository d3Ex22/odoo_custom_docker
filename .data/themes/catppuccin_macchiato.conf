# ============================================================================
#                  Catppuccin Macchiato (dark, medium)
# ============================================================================
# Source: https://github.com/catppuccin/catppuccin
# Accent: Mauve (official default)
# ============================================================================


# ==========================================
# Palette
# ==========================================

CLASSIC_RED="#ff0000"             # #ff0000
CLASSIC_GREEN="#00ff00"           # #00ff00
CLASSIC_YELLOW="#ffff00"          # #ffff00
CLASSIC_BLUE="#0000ff"            # #0000ff
CLASSIC_MAGENTA="#ff00ff"         # #ff00ff
CLASSIC_CYAN="#00ffff"            # #00ffff
CLASSIC_WHITE="#ffffff"           # #ffffff
CLASSIC_BLACK="#000000"           # #000000
CLASSIC_GRAY="#808080"            # #808080
CLASSIC_LIGHT_GRAY="#d3d3d3"      # #d3d3d3
CLASSIC_DARK_GRAY="#404040"       # #404040

CAT_ROSEWATER="#f4dbd6"           # #f4dbd6
CAT_FLAMINGO="#f0c6c6"            # #f0c6c6
CAT_PINK="#f5bde6"                # #f5bde6
CAT_MAUVE="#c6a0f6"               # #c6a0f6
CAT_RED="#ed8796"                 # #ed8796
CAT_MAROON="#ee99a0"              # #ee99a0
CAT_PEACH="#f5a97f"               # #f5a97f
CAT_YELLOW="#eed49f"              # #eed49f
CAT_GREEN="#a6da95"               # #a6da95
CAT_TEAL="#8bd5ca"                # #8bd5ca
CAT_SKY="#91d7e3"                 # #91d7e3
CAT_SAPPHIRE="#7dc4e4"            # #7dc4e4
CAT_BLUE="#8aadf4"                # #8aadf4
CAT_LAVENDER="#b7bdf8"            # #b7bdf8
CAT_TEXT="#cad3f5"                # #cad3f5
CAT_SUBTEXT1="#b8c0e0"            # #b8c0e0
CAT_SUBTEXT0="#a5adcb"            # #a5adcb
CAT_OVERLAY2="#939ab7"            # #939ab7
CAT_OVERLAY1="#8087a2"            # #8087a2
CAT_OVERLAY0="#6e738d"            # #6e738d
CAT_SURFACE2="#5b6078"            # #5b6078
CAT_SURFACE1="#494d64"            # #494d64
CAT_SURFACE0="#363a4f"            # #363a4f
CAT_BASE="#24273a"                # #24273a
CAT_MANTLE="#1e2030"              # #1e2030
CAT_CRUST="#181926"               # #181926

CAT_ANSI_BLACK="#494d64"          # #494d64
CAT_ANSI_RED="#ed8796"            # #ed8796
CAT_ANSI_GREEN="#a6da95"          # #a6da95
CAT_ANSI_YELLOW="#eed49f"         # #eed49f
CAT_ANSI_BLUE="#8aadf4"           # #8aadf4
CAT_ANSI_MAGENTA="#f5bde6"        # #f5bde6
CAT_ANSI_CYAN="#8bd5ca"           # #8bd5ca
CAT_ANSI_WHITE="#a5adcb"          # #a5adcb
CAT_ANSI_BRIGHT_BLACK="#5b6078"   # #5b6078
CAT_ANSI_BRIGHT_RED="#ec7486"     # #ec7486
CAT_ANSI_BRIGHT_GREEN="#8ccf7f"   # #8ccf7f
CAT_ANSI_BRIGHT_YELLOW="#e1c682"  # #e1c682
CAT_ANSI_BRIGHT_BLUE="#78a1f6"    # #78a1f6
CAT_ANSI_BRIGHT_MAGENTA="#f2a9dd" # #f2a9dd
CAT_ANSI_BRIGHT_CYAN="#63cbc0"    # #63cbc0
CAT_ANSI_BRIGHT_WHITE="#b8c0e0"   # #b8c0e0



STARSHIP_THEME="catppuccin_macchiato"


# ==========================================
# Main Colors
# ==========================================

COLOR_PRIMARY="${CAT_MAUVE}"
COLOR_SECONDARY="${CAT_BLUE}"
COLOR_TERTIARY="${CAT_PINK}"
COLOR_ACCENT="${CAT_SAPPHIRE}"
COLOR_SURFACE="${CAT_SURFACE0}"
COLOR_MUTED="${CAT_OVERLAY0}"

COLOR_BG="${CAT_BASE}"
COLOR_FG="${CAT_TEXT}"

COLOR_BLACK="${CLASSIC_BLACK}"
COLOR_WHITE="${CLASSIC_WHITE}"

COLOR_DEBUG="${CAT_LAVENDER}"
COLOR_INFO="${CAT_TEAL}"
COLOR_SUCCESS="${CAT_GREEN}"
COLOR_WARNING="${CAT_PEACH}"
COLOR_ERROR="${CAT_RED}"
COLOR_DANGER="${CAT_MAROON}"


# ==========================================
# Derived Colors
# ==========================================

# --- ZSH syntax highlighting ---
ZSH_HL_COMMAND="${COLOR_SUCCESS}"
ZSH_HL_UNKNOWN_COMMAND="${COLOR_ERROR}"
ZSH_HL_BUILTIN="${COLOR_SECONDARY}"
ZSH_HL_ALIAS="${COLOR_SUCCESS}"
ZSH_HL_FUNCTION="${COLOR_SUCCESS}"
ZSH_HL_PRECOMMAND="${COLOR_MUTED}"
ZSH_HL_STRING="${CAT_YELLOW}"
ZSH_HL_REDIRECTION="${COLOR_WARNING}"
ZSH_HL_SEPARATOR="${COLOR_MUTED}"
ZSH_HL_PROCESS="${COLOR_TERTIARY}"
ZSH_HL_COMMENT="${CAT_SURFACE2}"
ZSH_HL_PATH="${COLOR_ACCENT}"
ZSH_HL_GLOBBING="${COLOR_PRIMARY}"
ZSH_HL_ASSIGN="${COLOR_SECONDARY}"

# --- Odoo log level colors ---
ODOO_LOG_DEBUG="${COLOR_DEBUG}"
ODOO_LOG_INFO="${COLOR_INFO}"
ODOO_LOG_WARNING="${COLOR_WARNING}"
ODOO_LOG_ERROR="${COLOR_ERROR}"

# --- Web Terminal (xterm.js) ---
TERM_CURSOR="${CAT_ROSEWATER}"
TERM_SELECTION="${CAT_SURFACE2}"

WEBTERM_OVERLAY_COLOR="${COLOR_PRIMARY}"
WEBTERM_OVERLAY_BG="transparent"

# --- tmux ---
TMUX_BG="${COLOR_BG}"
TMUX_FG="${COLOR_FG}"
TMUX_BORDER_FG="${COLOR_BG}"
TMUX_BORDER_BG="${COLOR_BG}"

# --- tmux status bar ---
TMUX_STATUS_BG="${COLOR_BG}"
TMUX_STATUS_FG="${COLOR_MUTED}"

TMUX_ODOO_COLOR="#875a7b"
TMUX_PY_COLOR="#ffd43b"
TMUX_PG_COLOR="#336791"

TMUX_ALERT_FG="${COLOR_BG}"
TMUX_ALERT_BG="${COLOR_DANGER}"

# --- Terminal ANSI ---
TERM_BG="${CLASSIC_BLACK}"
TERM_FG="${CLASSIC_WHITE}"

TERM_BLACK="${CAT_ANSI_BLACK}"
TERM_RED="${CAT_ANSI_RED}"
TERM_GREEN="${CAT_ANSI_GREEN}"
TERM_YELLOW="${CAT_ANSI_YELLOW}"
TERM_BLUE="${CAT_ANSI_BLUE}"
TERM_MAGENTA="${CAT_ANSI_MAGENTA}"
TERM_CYAN="${CAT_ANSI_CYAN}"
TERM_WHITE="${CAT_ANSI_WHITE}"

TERM_BRIGHT_BLACK="${CAT_ANSI_BRIGHT_BLACK}"
TERM_BRIGHT_RED="${CAT_ANSI_BRIGHT_RED}"
TERM_BRIGHT_GREEN="${CAT_ANSI_BRIGHT_GREEN}"
TERM_BRIGHT_YELLOW="${CAT_ANSI_BRIGHT_YELLOW}"
TERM_BRIGHT_BLUE="${CAT_ANSI_BRIGHT_BLUE}"
TERM_BRIGHT_MAGENTA="${CAT_ANSI_BRIGHT_MAGENTA}"
TERM_BRIGHT_CYAN="${CAT_ANSI_BRIGHT_CYAN}"
TERM_BRIGHT_WHITE="${CAT_ANSI_BRIGHT_WHITE}"
