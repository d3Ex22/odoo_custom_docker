# ============================================================================
#                            Retrowave
# ============================================================================
# Vibrant neons on deep purple-black backgrounds.
# ============================================================================


# ==========================================
# Palette
# ==========================================

CLASSIC_RED="#ff0000"                  # #ff0000
CLASSIC_GREEN="#00ff00"                # #00ff00
CLASSIC_YELLOW="#ffff00"               # #ffff00
CLASSIC_BLUE="#0000ff"                 # #0000ff
CLASSIC_MAGENTA="#ff00ff"              # #ff00ff
CLASSIC_CYAN="#00ffff"                 # #00ffff
CLASSIC_WHITE="#ffffff"                # #ffffff
CLASSIC_BLACK="#000000"                # #000000
CLASSIC_GRAY="#808080"                 # #808080
CLASSIC_LIGHT_GRAY="#d3d3d3"           # #d3d3d3
CLASSIC_DARK_GRAY="#404040"            # #404040

PAL_RED="#ff2a6d"                      # #ff2a6d
PAL_MAROON="#d40078"                   # #d40078
PAL_PEACH="#ff6d1f"                    # #ff6d1f
PAL_ORANGE="#ff9e10"                   # #ff9e10
PAL_YELLOW="#f8e602"                   # #f8e602
PAL_GREEN="#4bff21"                    # #4bff21
PAL_TEAL="#05d9e8"                     # #05d9e8
PAL_CYAN="#00f0ff"                     # #00f0ff
PAL_SKY="#d1f7ff"                      # #d1f7ff
PAL_SAPPHIRE="#035ee8"                 # #035ee8
PAL_BLUE="#005678"                     # #005678
PAL_LAVENDER="#b388ff"                 # #b388ff
PAL_MAUVE="#9700cc"                    # #9700cc
PAL_PURPLE="#772289"                   # #772289
PAL_PINK="#f6019d"                     # #f6019d
PAL_MAGENTA="#ff00ff"                  # #ff00ff
PAL_ROSEWATER="#ffd6e8"                # #ffd6e8
PAL_TEXT="#f0e8ff"                     # #f0e8ff
PAL_SUBTEXT="#c0a8e0"                  # #c0a8e0
PAL_OVERLAY="#2e1060"                  # #2e1060
PAL_SURFACE2="#1e0a40"                 # #1e0a40
PAL_SURFACE1="#150730"                 # #150730
PAL_SURFACE0="#0d0420"                 # #0d0420
PAL_BASE="#05011a"                     # #05011a
PAL_MANTLE="#030110"                   # #030110
PAL_CRUST="#01012b"                    # #01012b



STARSHIP_THEME="retrowave"


# ==========================================
# Main Colors
# ==========================================

COLOR_PRIMARY="${PAL_YELLOW}"
COLOR_SECONDARY="${PAL_CYAN}"
COLOR_TERTIARY="${PAL_PINK}"
COLOR_ACCENT="${PAL_SAPPHIRE}"
COLOR_SURFACE="${PAL_SURFACE2}"
COLOR_MUTED="${PAL_SUBTEXT}"

COLOR_BG="${PAL_BASE}"
COLOR_FG="${PAL_TEXT}"

COLOR_BLACK="${CLASSIC_BLACK}"
COLOR_WHITE="${CLASSIC_WHITE}"

COLOR_DEBUG="${PAL_LAVENDER}"
COLOR_INFO="${PAL_TEAL}"
COLOR_SUCCESS="${PAL_GREEN}"
COLOR_WARNING="${PAL_ORANGE}"
COLOR_ERROR="${PAL_RED}"
COLOR_DANGER="${PAL_MAROON}"


# ==========================================
# Derived Colors
# ==========================================

# --- ZSH syntax highlighting ---
ZSH_HL_COMMAND="${COLOR_SUCCESS}"
ZSH_HL_UNKNOWN_COMMAND="${COLOR_ERROR}"
ZSH_HL_BUILTIN="${COLOR_SECONDARY}"
ZSH_HL_ALIAS="${COLOR_SUCCESS}"
ZSH_HL_FUNCTION="${COLOR_SUCCESS}"
ZSH_HL_PRECOMMAND="${COLOR_MUTED}"
ZSH_HL_STRING="${PAL_YELLOW}"
ZSH_HL_REDIRECTION="${COLOR_WARNING}"
ZSH_HL_SEPARATOR="${COLOR_MUTED}"
ZSH_HL_PROCESS="${COLOR_TERTIARY}"
ZSH_HL_COMMENT="${PAL_OVERLAY}"
ZSH_HL_PATH="${COLOR_ACCENT}"
ZSH_HL_GLOBBING="${COLOR_PRIMARY}"
ZSH_HL_ASSIGN="${COLOR_SECONDARY}"

# --- Odoo log level colors ---
ODOO_LOG_DEBUG="${COLOR_DEBUG}"
ODOO_LOG_INFO="${COLOR_INFO}"
ODOO_LOG_WARNING="${COLOR_WARNING}"
ODOO_LOG_ERROR="${COLOR_ERROR}"

# --- Web Terminal (xterm.js) ---
TERM_CURSOR="${COLOR_PRIMARY}"
TERM_SELECTION="${COLOR_SURFACE}"

WEBTERM_OVERLAY_COLOR="${COLOR_PRIMARY}"
WEBTERM_OVERLAY_BG="transparent"

# --- tmux ---
TMUX_BG="${COLOR_BG}"
TMUX_FG="${COLOR_FG}"
TMUX_BORDER_FG="${COLOR_BG}"
TMUX_BORDER_BG="${COLOR_BG}"

# --- tmux status bar ---
TMUX_STATUS_BG="${COLOR_BG}"
TMUX_STATUS_FG="${COLOR_MUTED}"

TMUX_ODOO_COLOR="#875a7b"
TMUX_PY_COLOR="#ffd43b"
TMUX_PG_COLOR="#336791"

TMUX_ALERT_FG="${COLOR_BG}"
TMUX_ALERT_BG="${COLOR_DANGER}"

# --- Terminal ANSI ---
TERM_BG="${CLASSIC_BLACK}"
TERM_FG="${CLASSIC_WHITE}"

TERM_BLACK="${CLASSIC_BLACK}"
TERM_RED="${CLASSIC_RED}"
TERM_GREEN="${CLASSIC_GREEN}"
TERM_YELLOW="${CLASSIC_YELLOW}"
TERM_BLUE="${CLASSIC_BLUE}"
TERM_MAGENTA="${CLASSIC_MAGENTA}"
TERM_CYAN="${CLASSIC_CYAN}"
TERM_WHITE="${CLASSIC_WHITE}"

TERM_BRIGHT_BLACK="${CLASSIC_DARK_GRAY}"
TERM_BRIGHT_RED="${ODOO_LOG_ERROR}"
TERM_BRIGHT_GREEN="${ODOO_LOG_INFO}"
TERM_BRIGHT_YELLOW="${ODOO_LOG_WARNING}"
TERM_BRIGHT_BLUE="${ODOO_LOG_DEBUG}"
TERM_BRIGHT_MAGENTA="${PAL_MAGENTA}"
TERM_BRIGHT_CYAN="${PAL_SKY}"
TERM_BRIGHT_WHITE="${CLASSIC_WHITE}"
