services:
  # ============================================
  # TRAEFIK - Reverse Proxy
  # ============================================
  traefik:
    container_name: ${COMPOSE_PROJECT_NAME:-odoo}_traefik
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker"
      - "--entrypoints.http.address=:80"
      - "--serversTransport.insecureSkipVerify=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      - web
    restart: unless-stopped
    stop_grace_period: 2s

  # ============================================
  # DATABASE - PostgreSQL
  # ============================================
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-odoo}_db
    build:
      context: .
      dockerfile: data/.docker/db/Dockerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-17}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./data/volumes/db/pgdata:/var/lib/postgresql/data
      - ./db_zip:/mnt/db_zip:rw
    networks:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER:-odoo}"]
      interval: 1s
      timeout: 5s
      retries: 5
    stop_grace_period: 2s

  # ============================================
  # ODOO - Application Server (screen session)
  # ============================================
  odoo:
    container_name: ${COMPOSE_PROJECT_NAME:-odoo}_odoo
    build:
      context: .
      dockerfile: data/.docker/odoo/Dockerfile
      args:
        ODOO_VERSION: ${ODOO_VERSION:-19.0}
        ODOO_BUILD: ${ODOO_BUILD:-latest}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/odoo.conf:/etc/odoo/odoo.conf
      - ${ADDONS_PATH:-./addons}:/mnt/extra-addons:rw
      - ${ENTERPRISE_PATH:-./data/.enterprise_placeholder}:/mnt/enterprise-addons:ro
      - ./.env:/home/odoo/.env:ro
      - ./data/volumes/odoo/filestore:/var/lib/odoo/filestore
      - ./data/volumes/odoo/sessions:/var/lib/odoo/sessions
      - ./data/volumes/odoo/logs:/var/log/odoo
      - ./data/volumes/odoo/cache:/var/lib/odoo/cache
      - ./data/migration_scripts:/opt/migration_scripts:ro
      - ./data/.pre-commit-config.yaml:/opt/.pre-commit-config.yaml:ro
    environment:
      - HOST=db
      - PORT=5432
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo}
    stdin_open: true
    tty: true
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo.rule=Host(`odoo.${DOMAIN_SUFFIX:-docker.localhost}`)"
      - "traefik.http.routers.odoo.entrypoints=http"
      - "traefik.http.services.odoo.loadbalancer.server.port=8069"
    restart: unless-stopped
    stop_grace_period: 2s

  # ============================================
  # UTILS - Admin Tools
  # ============================================
  utils:
    container_name: ${COMPOSE_PROJECT_NAME:-odoo}_utils
    build:
      context: .
      dockerfile: data/.docker/utils/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - .:/home/odoo/docker_dev:rw
      - ${ODOO_PATH:-./data/.odoo_placeholder}:/home/odoo/odoo_src:ro
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-odoo}
      - ODOO_VERSION=${ODOO_VERSION:-19.0}
      - PYTHON_VERSION=${PYTHON_VERSION:-3.12}
      - POSTGRES_VERSION=${POSTGRES_VERSION:-17}
      - ODOO_PATH=/home/odoo/odoo_src
      - HOST_PROJECT_DIR=${COMPOSE_PROJECT_DIR:-.}
    stdin_open: true
    tty: true
    networks:
      - web
    restart: unless-stopped
    stop_grace_period: 2s

  # ============================================
  # TTYD - Web Terminal for Utils
  # ============================================
  ttyd_utils:
    container_name: ${COMPOSE_PROJECT_NAME:-odoo}_ttyd_utils
    build:
      context: .
      dockerfile: data/.docker/ttyd_utils/Dockerfile
    environment:
      - UTILS_CONTAINER=${COMPOSE_PROJECT_NAME:-odoo}_utils
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./data/ttyd.conf:/etc/ttyd.conf:ro
      - ./data/theme.conf:/etc/theme.conf:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ttyd_utils.rule=Host(`utils.${DOMAIN_SUFFIX:-docker.localhost}`)"
      - "traefik.http.services.ttyd_utils.loadbalancer.server.port=7681"
    restart: unless-stopped
    stop_grace_period: 2s

  # ============================================
  # TTYD - Odoo Logs (interactive + scrollable)
  # ============================================
  ttyd_logs:
    container_name: ${COMPOSE_PROJECT_NAME:-odoo}_ttyd_logs
    build:
      context: .
      dockerfile: data/.docker/ttyd_logs/Dockerfile
    environment:
      - ODOO_CONTAINER=${COMPOSE_PROJECT_NAME:-odoo}_odoo
      - UTILS_CONTAINER=${COMPOSE_PROJECT_NAME:-odoo}_utils
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./data/ttyd.conf:/etc/ttyd.conf:ro
      - ./data/theme.conf:/etc/theme.conf:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ttyd_logs.rule=Host(`logs.${DOMAIN_SUFFIX:-docker.localhost}`)"
      - "traefik.http.services.ttyd_logs.loadbalancer.server.port=7681"
    restart: unless-stopped
    stop_grace_period: 2s

networks:
  web:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/16}
