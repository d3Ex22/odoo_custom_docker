services:
  traefik:
    container_name: traefik
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker"
      - "--entrypoints.http.address=:80"
      - "--serversTransport.insecureSkipVerify=true"
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.docker.localhost`)"
      - "traefik.http.routers.api.entrypoints=http"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    networks:
      web:
        ipv4_address: 192.168.2.4
    restart: unless-stopped
  db:
    container_name: db
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data/pgdata
      - ./db_zip:/mnt/db_zip:rw
    restart: unless-stopped
    networks:
      web:
        ipv4_address: 192.168.2.2
  odoo:
    container_name: odoo
    build:
      context: .
      dockerfile: data/config/odoo/Dockerfile
      pull: true
    depends_on:
      - db
    volumes:
      - ./data/odoo:/var/lib/odoo
      - ./data/config/odoo.conf:/etc/odoo/odoo.conf
      - ./.env:/home/odoo/.env
      - ${ENTERPRISE_PATH}:/mnt/enterprise-addons
      - ${ADDONS_PATH}:/mnt/extra-addons:rw
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DB=postgres
      - PORT=5432
    entrypoint: /home/odoo/entrypoint.sh
    # command:
    #   - /bin/bash
    #   - -c
    #   - |
    #     service ssh start
    #     pip install -r /mnt/extra-addons/requirements.txt --break-system-packages --ignore-installed
    #     odoo ${ODOO_ARGS}
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      web:
        ipv4_address: 192.168.2.3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo.rule=Host(`odoo.docker.localhost`)"
      - "traefik.http.routers.odoo.entrypoints=http"
      - "traefik.docker.network=odoo"
      - "traefik.http.services.odoo.loadbalancer.server.port=8069"
  logs:
    container_name: logs
    build:
      context: .
      dockerfile: data/config/logs/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    command: 
      - /bin/bash
      - -c
      - |
        service ssh start
        tail -F anything
    stdin_open: true
    tty: true
    networks:
      web:
        ipv4_address: 192.168.2.6
    restart: unless-stopped
  utils:
    container_name: utils
    build:
      context: .
      dockerfile: data/config/utils/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./data/scripts:/mnt/scripts
      - ./addons:/home/odoo/addons:rw
      - ./data:/home/odoo/data
      - ./db_zip:/home/odoo/db_zip:rw
      - ./.env:/home/odoo/.env
      - ./docker-compose.yml:/home/odoo/docker-compose.yml
    command: 
      - /bin/bash
      - -c
      - |
        service ssh start
        tail -F anything
    stdin_open: true
    tty: true
    networks:
      web:
        ipv4_address: 192.168.2.8
    restart: unless-stopped
  wetty_shell:
    container_name: wetty_shell
    image: wettyoss/wetty:latest
    depends_on:
      - traefik
    tty: true
    command: wetty
    environment:
      BASE: '/'
      PORT: 3000
      SSHHOST: 'odoo'
      SSHPORT: 22
      NODE_ENV: 'development'
      SSHUSER: 'odoo'
      SSHPASS: 'odoo'
    networks:
      web:
        ipv4_address: 192.168.2.5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wetty_shell.rule=Host(`shell.docker.localhost`)"
      - "traefik.http.routers.wetty_shell.entrypoints=http"
      - "traefik.docker.network=wetty_shell"
      - "traefik.http.services.wetty_shell.loadbalancer.server.port=3000"
    restart: unless-stopped
  wetty_logs:
    container_name: wetty_logs
    image: wettyoss/wetty:latest
    depends_on:
      - logs
      - traefik
    tty: true
    command: wetty
    environment:
      BASE: '/'
      PORT: 3001
      SSHHOST: 'logs'
      SSHPORT: 22
      NODE_ENV: 'development'
      SSHUSER: 'odoo'
      SSHPASS: 'odoo'
    networks:
      web: 
        ipv4_address: 192.168.2.7
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wetty_logs.rule=Host(`logs.docker.localhost`)"
      - "traefik.http.routers.wetty_logs.entrypoints=http"
      - "traefik.docker.network=wetty_logs"
      - "traefik.http.services.wetty_logs.loadbalancer.server.port=3001"
    restart: unless-stopped
  wetty_utils:
    container_name: wetty_utils
    image: wettyoss/wetty:latest
    depends_on:
      - utils
      - traefik
    tty: true
    command: wetty
    environment:
      BASE: '/'
      PORT: 3002
      SSHHOST: 'utils'
      SSHPORT: 22
      NODE_ENV: 'development'
      SSHUSER: 'odoo'
      SSHPASS: 'odoo'
    networks:
      web: 
        ipv4_address: 192.168.2.9
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wetty_utils.rule=Host(`utils.docker.localhost`)"
      - "traefik.http.routers.wetty_utils.entrypoints=http"
      - "traefik.docker.network=wetty_utils"
      - "traefik.http.services.wetty_utils.loadbalancer.server.port=3002"
    restart: unless-stopped
networks:
  web:
    external: true
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24