# ============================================================================
# Prompt of the utils shell (https://starship.rs/config).
# ${THEME_*} placeholders are filled from .data/scripts/lib/theme.sh by the
# entrypoint (envsubst) into /home/utils/starship.toml; 'primary' is the colour
# of the project (its hub tab). Powerline / Nerd Font glyphs: see terminal.conf.
# Applied at container start: docker compose restart <project>_utils.
# ============================================================================
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](p_user)\
$username\
[](bg:primary fg:p_user)\
$directory\
[](bg:p_git fg:primary)\
$git_branch\
$git_status\
[](bg:p_time fg:p_git)\
$python\
$time\
[ ](fg:p_time)\
$cmd_duration\
$line_break\
$character"""

palette = 'night_city'

[palettes.night_city]
bg = '${THEME_BG}'
fg = '${THEME_FG}'
muted = '${THEME_MUTED}'
red = '${THEME_RED}'
orange = '${THEME_ORANGE}'
yellow = '${THEME_YELLOW}'
green = '${THEME_GREEN}'
cyan = '${THEME_CYAN}'
blue = '${THEME_BLUE}'
purple = '${THEME_PURPLE}'
primary = '${THEME_PRIMARY}'
p_user = '${THEME_PROMPT_USER}'   # never the primary colour (lib/theme.sh)
p_git = '${THEME_PROMPT_GIT}'
p_time = '${THEME_PROMPT_TIME}'

[username]
show_always = true
style_user = 'bg:p_user fg:bg bold'
style_root = 'bg:p_user fg:bg bold'
format = '[ 󰌽 $user ]($style)'

[directory]
style = 'bg:primary fg:bg'
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'

[directory.substitutions]
'odoo_custom_docker' = '󰡨 env'
'addons' = ' addons'

[git_branch]
symbol = ''
style = 'bg:p_git'
format = '[[ $symbol $branch ](fg:bg bg:p_git)]($style)'

[git_status]
style = 'bg:p_git'
format = '[[($all_status$ahead_behind )](fg:bg bg:p_git)]($style)'

[python]
symbol = ''
style = 'bg:p_time'
format = '[[ $symbol( $version) ](fg:bg bg:p_time)]($style)'

[time]
disabled = false
time_format = '%T'
style = 'bg:p_time'
format = '[[  $time ](fg:bg bg:p_time)]($style)'

[cmd_duration]
show_milliseconds = true
format = '[ took $duration ](fg:muted)'

[line_break]
disabled = true

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:cyan)'
