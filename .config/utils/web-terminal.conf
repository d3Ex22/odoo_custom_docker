# ============================================
# WEB TERMINAL CONFIGURATION
# Sourced by entrypoint scripts
# Colors are defined in utils/theme.conf
# ============================================

# --- Font (rendered client-side, install a Nerd Font locally) ---
# https://www.nerdfonts.com/
WEBTERM_FONT_FAMILY="JetBrainsMono Nerd Font, Ubuntu, monospace"
WEBTERM_FONT_SIZE=15
WEBTERM_FONT_WEIGHT=500
WEBTERM_FONT_WEIGHT_BOLD=700

# --- Cursor & scrollback ---
# TMUX_SCROLLBACK: tmux history; WEBTERM_SCROLLBACK: xterm.js browser buffer
# TMUX_CURSOR_STYLE: block | underline | bar
TMUX_CURSOR_STYLE=bar
TMUX_CURSOR_BLINK=true
TMUX_SCROLLBACK=50000
WEBTERM_SCROLLBACK=50000

# --- Overlay Messages ---
WEBTERM_MSG_CONNECTING="Connecting..."
WEBTERM_MSG_RECONNECTING="Reconnecting..."
WEBTERM_MSG_COPIED="Copied"
