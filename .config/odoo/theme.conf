# ============================================================================
# ODOO CONTAINER — Theme overrides
# ============================================================================
#
# HOW IT WORKS:
#   1. The entrypoint loads the theme specified by DEFAULT_THEME from
#      .data/themes/<name>.conf — this provides ALL color variables.
#   2. If USE_DEFAULT_THEME=false, .data/themes/default.conf is loaded instead.
#   3. Any UNCOMMENTED variable below acts as a FORCED OVERRIDE on top of
#      the loaded theme. Keep lines commented to use the theme's value.
#
# Available themes:
# - catppuccin_mocha
# - catppuccin_frappe
# - catppuccin_macchiato
# - catppuccin_latte
# - retrowave
# - cyberpunk_neon
# - cyberpunk_2077
# - synthwave_84
# - dracula
# - tokyo_night
#
# ============================================================================

USE_DEFAULT_THEME=true
DEFAULT_THEME="retrowave"

