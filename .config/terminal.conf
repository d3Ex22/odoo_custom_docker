# ============================================================================
# Web terminals (logs and utils) — font, cursor, scrollback.
# Read by both entrypoints; colors come from .data/scripts/lib/theme.sh.
# Applied at container start: docker compose restart <container>.
# ============================================================================

# Font of the xterm.js client (installed on your machine, not in the container;
# Nerd Font "Mono" / "Propo" variants are skipped by the client).
# https://www.nerdfonts.com/
WEBTERM_FONT_FAMILY='"JetBrainsMono Nerd Font", Consolas, Menlo, Ubuntu, monospace'
WEBTERM_FONT_SIZE=15
WEBTERM_FONT_WEIGHT=500
WEBTERM_FONT_WEIGHT_BOLD=700

# Cursor of the utils shell: block | underline | bar
TMUX_CURSOR_STYLE=bar
TMUX_CURSOR_BLINK=true

# History: tmux panes and the browser buffer
TMUX_SCROLLBACK=50000
WEBTERM_SCROLLBACK=50000

# Time zone of the clocks (tmux status bar, prompt, date in the utils shell)
TERMINAL_TZ=Europe/Paris
